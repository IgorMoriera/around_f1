name: Weekly F1 update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      season:
        description: 'Temporada (deixe em branco para atual)'
        required: false
      dry_run:
        description: 'Detectar pendências sem gravar nada'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar Dependências
        run: pip install -e ".[dev]" fastf1

      - name: Executar Ingestão Incremental
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
          SEASON: ${{ inputs.season || '2026' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/run_weekly_update.py

      - name: Commitar Heartbeat e Mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
          git push

      - name: Notificar falha
        if: failure()
        run: |
          echo "::error::Weekly update failed. Verifique os logs da ingestão acima."
